version: '3.8'

services:
  # 1. PostgreSQL Database (Storage for events, alerts, incidents, audit logs)
  postgres:
    image: postgres:16-alpine
    container_name: cloudguard-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-cloudguard_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ${POSTGRES_DB:-cloudguard_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - seclab-network

  # 2. Redis Streams (SecLab XDR Central Event Bus)
  redis:
    image: redis:7-alpine
    container_name: seclab-redis-bus
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - seclab-network

  # 3. Next.js 16 Web Dashboard (CloudGuard SOC UI)
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cloudguard-web
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      # In-cluster or external FastAPI backend URL:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-cloudguard_db}
      - JWT_SECRET=${JWT_SECRET:-cloudguard-soc-dev-secret-change-in-production-32chars}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - seclab-network

networks:
  seclab-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
