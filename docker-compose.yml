services:
  # 1. PostgreSQL Database (Storage for events, alerts, incidents, audit logs)
  postgres:
    image: postgres:18-alpine
    container_name: cloudguard-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      FLYWAY_USER: ${FLYWAY_USER:?set FLYWAY_USER in .env}
      FLYWAY_PASSWORD: ${FLYWAY_PASSWORD:?set FLYWAY_PASSWORD in .env}
      DB_USER: ${DB_USER:?set DB_USER in .env}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:?set POSTGRES_PORT in .env}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/docker/init-roles.sh:/docker-entrypoint-initdb.d/init-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - seclab-network

  # 2. Spring Boot Backend (Single API Authority: Auth, RBAC, Data Services)
  backend:
    build: ./backend
    container_name: cloudguard-backend
    restart: always
    ports:
      # Bound to 127.0.0.1 loopback only to avoid exposing container directly on public network
      - "127.0.0.1:8080:8080"
    environment:
      # Target container host 'postgres' inside compose network rather than host localhost
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:?set POSTGRES_DB in .env}
      DB_USER: ${DB_USER:?set DB_USER in .env}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      FLYWAY_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:?set POSTGRES_DB in .env}
      FLYWAY_USER: ${FLYWAY_USER:?set FLYWAY_USER in .env}
      FLYWAY_PASSWORD: ${FLYWAY_PASSWORD:?set FLYWAY_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - seclab-network

  # 3. Next.js 16 Web Dashboard (CloudGuard SOC UI)
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cloudguard-web
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - BACKEND_URL=http://backend:8080
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:?set NEXT_PUBLIC_API_URL in .env}
    depends_on:
      backend:
        condition: service_started
    networks:
      - seclab-network

networks:
  seclab-network:
    driver: bridge

volumes:
  postgres_data:

