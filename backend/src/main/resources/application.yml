server:
  port: 8080

spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/cloudguard_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1

cloudguard:
  jwt:
    # Default is a Base64-encoded 256-bit key for local development ONLY.
    # In production, always override via JWT_SECRET environment variable with a secure random Base64 value.
    secret: ${JWT_SECRET:Y2xvdWRndWFyZC1kZXYtc2VjcmV0LWtleS0yMDI2LW11c3QtYmUtY2hhbmdlZC1pbi1wcm9kdWN0aW9u}
    expiration-ms: 86400000
  cors:
    allowed-origins: ${FRONTEND_URL:http://localhost:3000}
  security:
    max-failed-login-attempts: 5
    lockout-duration-minutes: 30
