spring:
  datasource:
    url: jdbc:tc:postgresql:15-alpine:///cloudguard_test
    username: test
    password: test
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver
  sql:
    init:
      mode: always
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

cloudguard:
  security:
    jwt:
      secret: "zQ3j7K2wH5bR+X/uV4m9nP1hG8sF0yL6cT3aE7vM9qJ2w=\n" # Base64 encoded test secret
      expiration-ms: 3600000

logging:
  level:
    org.springframework.web: ERROR
    org.springframework.security: ERROR
    com.cloudguard: INFO
