spring:
  config:
    import:
      - optional:file:../.env[.properties]
      - optional:file:.env[.properties]
  datasource:
    url: ${TEST_DB_URL:jdbc:postgresql://localhost:5432/cloudguard_test}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    url: ${TEST_FLYWAY_URL:${TEST_DB_URL:jdbc:postgresql://localhost:5432/cloudguard_test}}
    user: ${FLYWAY_USER}
    password: ${FLYWAY_PASSWORD}
    locations: classpath:db/migration
    clean-disabled: false
  sql:
    init:
      mode: always
      data-locations: classpath:fixtures/test-data.sql
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

cloudguard:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: 3600000
  cors:
    allowed-origins: "http://localhost:3000"

logging:
  level:
    org.springframework.web: ERROR
    org.springframework.security: ERROR
    com.cloudguard: INFO
